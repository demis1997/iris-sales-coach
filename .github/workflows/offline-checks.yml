name: Offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mock-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Permission boundaries
        run: npm run test:unit
      - name: Deterministic mock AI contracts (no provider credentials)
        run: npm run test:ai
      - name: Build without live service credentials
        run: npm run build
